name: Reporte de error
description: Algo no funciona como debería
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por tomarte el tiempo de reportar. Cuanto más concreto, más rápido se arregla.

  - type: textarea
    id: que-paso
    attributes:
      label: ¿Qué pasó?
      description: Describe el comportamiento observado.
    validations:
      required: true

  - type: textarea
    id: esperado
    attributes:
      label: ¿Qué esperabas que pasara?
    validations:
      required: true

  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Abrir el editor
        2. Seleccionar la entidad...
        3. Pulsar Reproducir
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Versión de Ollin
      description: Commit o etiqueta (por ejemplo v0.3.0).
    validations:
      required: false

  - type: input
    id: entorno
    attributes:
      label: Entorno
      description: Salida de `dotnet --info` y versión de Windows.
    validations:
      required: false

  - type: textarea
    id: consola
    attributes:
      label: Mensajes de la consola
      description: Copia los errores o avisos del editor.
      render: text
    validations:
      required: false

  - type: textarea
    id: capturas
    attributes:
      label: Capturas o vídeo
      description: Arrastra aquí imágenes si ayudan a entender el problema.
    validations:
      required: false
