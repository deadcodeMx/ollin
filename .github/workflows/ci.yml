name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Compilar y probar
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar
        run: dotnet restore Ollin.sln

      - name: Compilar
        run: dotnet build Ollin.sln -c Release --no-restore

      - name: Pruebas
        run: dotnet run --project tests/Ollin.Tests/Ollin.Tests.csproj -c Release --no-build

      - name: Publicar artefacto del editor
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ollin-editor
          path: src/Ollin.Editor/bin/Release/net8.0/
          if-no-files-found: ignore
